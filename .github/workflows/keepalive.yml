name: Supabase keepalive
# Pings the Enforce Supabase project every 2 days so the free-tier project
# never auto-pauses from inactivity. Runs on GitHub's servers (free).
on:
  schedule:
    - cron: '17 2 */2 * *'   # every 2 days, 02:17 UTC
  workflow_dispatch:          # allows a manual run
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (DB query) + Auth
        run: |
          URL="https://pwhpybintubqinxubhwy.supabase.co"
          KEY="sb_publishable_WJNB1bTW0CWiQEEcWGzKGA_hA0N0RvN"
          echo "REST:  $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/rest/v1/jobs?select=id&limit=1")"
          echo "AUTH:  $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/auth/v1/health")"
          echo "Keepalive ping done at $(date -u)"
